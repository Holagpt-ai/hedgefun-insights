name: Journal database runtime gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/2026081619*.sql"
      - "supabase/tests/database/**"
      - "supabase/tests/fixtures/**"
      - "scripts/ci/journal-db-runtime.sh"
      - ".github/workflows/journal-db-runtime.yml"
  push:
    branches:
      - cursor/stocksist-trading-journal-complete
    paths:
      - "supabase/migrations/2026081619*.sql"
      - "supabase/tests/database/**"
      - "supabase/tests/fixtures/**"
      - "scripts/ci/journal-db-runtime.sh"
      - ".github/workflows/journal-db-runtime.yml"

permissions:
  contents: read

concurrency:
  group: journal-db-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-database:
    name: Clean database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run clean-database Journal runtime tests
        run: |
          sed -i 's/\r$//' scripts/ci/journal-db-runtime.sh
          chmod +x scripts/ci/journal-db-runtime.sh
          scripts/ci/journal-db-runtime.sh clean

  legacy-upgrade:
    name: Legacy upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run legacy-upgrade Journal runtime tests
        run: |
          sed -i 's/\r$//' scripts/ci/journal-db-runtime.sh
          chmod +x scripts/ci/journal-db-runtime.sh
          scripts/ci/journal-db-runtime.sh legacy
