name: Journal database runtime gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/2026081619*.sql"
      - "supabase/tests/database/**"
      - "supabase/tests/fixtures/**"
      - "scripts/ci/journal-db-runtime.sh"
      - "scripts/ci/journal-acl-delta.py"
      - "scripts/ci/journal-fn-acl-delta.py"
      - "scripts/journal/**"
      - ".github/workflows/journal-db-runtime.yml"
  push:
    branches:
      - cursor/stocksist-trading-journal-complete
    paths:
      - "supabase/migrations/2026081619*.sql"
      - "supabase/tests/database/**"
      - "supabase/tests/fixtures/**"
      - "scripts/ci/journal-db-runtime.sh"
      - "scripts/ci/journal-acl-delta.py"
      - "scripts/ci/journal-fn-acl-delta.py"
      - "scripts/journal/**"
      - ".github/workflows/journal-db-runtime.yml"

permissions:
  contents: read

concurrency:
  group: journal-db-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-database:
    name: Clean database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Run clean-database Journal runtime tests
        run: |
          sed -i 's/\r$//' scripts/ci/journal-db-runtime.sh
          chmod +x scripts/ci/journal-db-runtime.sh
          scripts/ci/journal-db-runtime.sh clean

  legacy-upgrade:
    name: Legacy upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Run legacy-upgrade Journal runtime tests
        run: |
          sed -i 's/\r$//' scripts/ci/journal-db-runtime.sh
          chmod +x scripts/ci/journal-db-runtime.sh
          scripts/ci/journal-db-runtime.sh legacy

  m1-failclosed:
    name: Migration 1 fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Run Migration 1 fail-closed Journal runtime tests
        run: |
          sed -i 's/\r$//' scripts/ci/journal-db-runtime.sh
          chmod +x scripts/ci/journal-db-runtime.sh
          scripts/ci/journal-db-runtime.sh m1

  parity-catalog:
    name: Old vs new catalog parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Compare approved three-file catalog to runner-native sequence
        run: |
          sed -i 's/\r$//' scripts/ci/journal-db-runtime.sh
          chmod +x scripts/ci/journal-db-runtime.sh
          scripts/ci/journal-db-runtime.sh parity
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journal-catalog-dumps
          path: /tmp/journal-catalog-*.txt
          if-no-files-found: ignore

