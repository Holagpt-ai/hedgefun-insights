name: Scanner worker Deno tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/scanner-stream-worker/**"
      - ".github/workflows/scanner-worker-deno.yml"
  push:
    branches:
      - main
    paths:
      - "services/scanner-stream-worker/**"
      - ".github/workflows/scanner-worker-deno.yml"

permissions:
  contents: read

concurrency:
  group: scanner-worker-deno-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    name: Scanner stream worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
      - name: Scanner stream worker tests
        working-directory: services/scanner-stream-worker
        run: deno task test
