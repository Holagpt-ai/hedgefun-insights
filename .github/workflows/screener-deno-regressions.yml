name: Screener Deno regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/screeners/**"
      - "supabase/functions/sync-screener-data/**"
      - "supabase/functions/_shared/markets/equity-session-control.ts"
      - "supabase/functions/_shared/markets/equity-session-control_test.ts"
      - "supabase/functions/_shared/markets/session-schedule.ts"
      - "supabase/tests/screener-sync-pg/**"
      - "scripts/supabase/screener-sync-pg-test-setup.mjs"
      - "supabase/migrations/20261104120000_screener_sync_stale_finalizing_reconcile_v1.sql"
      - "supabase/migrations/20261104230000_screener_sync_slim_control_json_v1.sql"
      - "supabase/migrations/20261106200000_ops_scanner_diagnostics_read_v1.sql"
      - "supabase/migrations/20260813180000_equities_session_calendar.sql"
      - "src/lib/screeners/**"
      - ".github/workflows/screener-deno-regressions.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/screeners/**"
      - "supabase/functions/sync-screener-data/**"
      - "supabase/functions/_shared/markets/equity-session-control.ts"
      - "supabase/functions/_shared/markets/equity-session-control_test.ts"
      - "supabase/functions/_shared/markets/session-schedule.ts"
      - "supabase/tests/screener-sync-pg/**"
      - "scripts/supabase/screener-sync-pg-test-setup.mjs"
      - "supabase/migrations/20261104120000_screener_sync_stale_finalizing_reconcile_v1.sql"
      - "supabase/migrations/20261104230000_screener_sync_slim_control_json_v1.sql"
      - "supabase/migrations/20261106200000_ops_scanner_diagnostics_read_v1.sql"
      - "supabase/migrations/20260813180000_equities_session_calendar.sql"
      - "src/lib/screeners/**"
      - ".github/workflows/screener-deno-regressions.yml"

permissions:
  contents: read

concurrency:
  group: screener-deno-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Critical screener tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: screener_pg_ci_test
          POSTGRES_DB: screener_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d screener_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCREENER_SYNC_PG_TEST_URL: postgresql://postgres:screener_pg_ci_test@localhost:5432/screener_sync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Postgres (Batch 190 migrations)
        run: node scripts/supabase/screener-sync-pg-test-setup.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
      - name: Screener regression tests
        run: >
          deno test --frozen --allow-read --allow-env --allow-net=localhost:5432,127.0.0.1:5432
          supabase/functions/_shared/screeners/extended-session-move_test.ts
          supabase/functions/_shared/screeners/gappers-premarket_test.ts
          supabase/functions/_shared/screeners/premarket-rollover_test.ts
          supabase/functions/_shared/screeners/evaluation-evidence_test.ts
          supabase/functions/_shared/screeners/rows_test.ts
          supabase/functions/_shared/screeners/selection_test.ts
          supabase/functions/_shared/screeners/sync-screener-universe-cpu_test.ts
          supabase/functions/_shared/screeners/session-volume-cache-parity_test.ts
          supabase/functions/_shared/screeners/chunked-selection-parity_test.ts
          supabase/functions/_shared/screeners/sync-orchestrator-concurrency_test.ts
          supabase/functions/_shared/screeners/sync-continue-dispatch_test.ts
          supabase/functions/_shared/screeners/sync-staged-e2e_test.ts
          supabase/functions/_shared/screeners/sync-chunk-handoff_test.ts
          supabase/functions/_shared/screeners/policy-exclusion-serialize_test.ts
          supabase/functions/_shared/screeners/sync-staging-postgres-integration_test.ts
          supabase/functions/_shared/screeners/sync-staging-advance-acl_contract_test.ts
          supabase/functions/_shared/screeners/sync-staging-rpc-acl-hardening_contract_test.ts
          supabase/functions/_shared/screeners/sync-staging-advance-acl-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-rpc-acl-hardening-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-expiry_test.ts
          supabase/functions/_shared/screeners/sync-staging-abort-diagnostics_test.ts
          supabase/functions/_shared/screeners/sync-staging-abort-diagnostics-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-abort-diagnostics_contract_test.ts
          supabase/functions/_shared/screeners/sync-staging-resume_test.ts
          supabase/functions/_shared/screeners/sync-finalize-recovery_test.ts
          supabase/functions/_shared/screeners/sync-finalize-lease-release_test.ts
          supabase/functions/_shared/screeners/sync-finalize-lease-release-postgres_test.ts
          supabase/functions/_shared/screeners/sync-finalize-diagnostics_test.ts
          supabase/functions/_shared/screeners/batch216-finalize-stage-marker_test.ts
          supabase/functions/_shared/screeners/batch216-finalize-stage-marker-postgres_test.ts
          supabase/functions/_shared/screeners/sync-finalize-lease-release_contract_test.ts
          supabase/functions/_shared/screeners/sync-finalize-lease-release-acl-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-postgres-acl-helpers_test.ts
          supabase/functions/_shared/screeners/batch190-10-publish-integrity_test.ts
          supabase/functions/_shared/screeners/sync-publish-rpc-error_test.ts
          supabase/functions/_shared/screeners/sync-staging-supabase-publish-error_test.ts
          supabase/functions/_shared/screeners/batch190-12-stale-finalizing-reconcile_test.ts
          supabase/functions/_shared/screeners/batch190-12-stale-finalizing-reconcile-postgres_test.ts
          supabase/functions/_shared/screeners/batch213-ops-diagnostics-postgres_test.ts
          supabase/functions/_shared/screeners/batch190-14-finalize-cpu_test.ts
          supabase/functions/_shared/screeners/batch190-16-finalize-preflight_test.ts
          supabase/functions/_shared/screeners/batch190-15-slim-payload_test.ts
          supabase/functions/sync-screener-data/batch190-13-cron-body-normalize_test.ts
          supabase/functions/sync-screener-data/batch215-cron-session-gate_test.ts
          supabase/functions/_shared/markets/equity-session-control_test.ts
          supabase/functions/sync-screener-data/handler_evidence_persistence_test.ts
          supabase/functions/_shared/market-data/float_test.ts
