name: Screener Deno regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/screeners/**"
      - "supabase/functions/sync-screener-data/**"
      - "supabase/tests/screener-sync-pg/**"
      - "scripts/supabase/screener-sync-pg-test-setup.mjs"
      - "src/lib/screeners/**"
      - ".github/workflows/screener-deno-regressions.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/screeners/**"
      - "supabase/functions/sync-screener-data/**"
      - "supabase/tests/screener-sync-pg/**"
      - "scripts/supabase/screener-sync-pg-test-setup.mjs"
      - "src/lib/screeners/**"
      - ".github/workflows/screener-deno-regressions.yml"

permissions:
  contents: read

concurrency:
  group: screener-deno-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Critical screener tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: screener_pg_ci_test
          POSTGRES_DB: screener_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d screener_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCREENER_SYNC_PG_TEST_URL: postgresql://postgres:screener_pg_ci_test@localhost:5432/screener_sync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Postgres (Batch 190 migrations)
        run: node scripts/supabase/screener-sync-pg-test-setup.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
      - name: Screener regression tests
        run: >
          deno test --frozen --allow-read --allow-env --allow-net=localhost:5432,127.0.0.1:5432
          supabase/functions/_shared/screeners/extended-session-move_test.ts
          supabase/functions/_shared/screeners/gappers-premarket_test.ts
          supabase/functions/_shared/screeners/premarket-rollover_test.ts
          supabase/functions/_shared/screeners/evaluation-evidence_test.ts
          supabase/functions/_shared/screeners/rows_test.ts
          supabase/functions/_shared/screeners/selection_test.ts
          supabase/functions/_shared/screeners/sync-screener-universe-cpu_test.ts
          supabase/functions/_shared/screeners/session-volume-cache-parity_test.ts
          supabase/functions/_shared/screeners/chunked-selection-parity_test.ts
          supabase/functions/_shared/screeners/sync-orchestrator-concurrency_test.ts
          supabase/functions/_shared/screeners/sync-continue-dispatch_test.ts
          supabase/functions/_shared/screeners/sync-staged-e2e_test.ts
          supabase/functions/_shared/screeners/sync-chunk-handoff_test.ts
          supabase/functions/_shared/screeners/policy-exclusion-serialize_test.ts
          supabase/functions/_shared/screeners/sync-staging-postgres-integration_test.ts
          supabase/functions/_shared/screeners/sync-staging-advance-acl_contract_test.ts
          supabase/functions/_shared/screeners/sync-staging-rpc-acl-hardening_contract_test.ts
          supabase/functions/_shared/screeners/sync-staging-advance-acl-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-rpc-acl-hardening-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-expiry_test.ts
          supabase/functions/_shared/screeners/sync-staging-abort-diagnostics_test.ts
          supabase/functions/_shared/screeners/sync-staging-abort-diagnostics-postgres_test.ts
          supabase/functions/_shared/screeners/sync-staging-abort-diagnostics_contract_test.ts
          supabase/functions/_shared/screeners/sync-staging-resume_test.ts
          supabase/functions/_shared/screeners/sync-finalize-recovery_test.ts
          supabase/functions/sync-screener-data/handler_evidence_persistence_test.ts
