# Deploy from the repository root so Docker build context includes shared files:
#   fly deploy --config fly.radar.toml
app = "stocksist-radar-v22-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "services/scanner-stream-worker/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
