# Deploy from the repository root so the Docker context includes src/:
#   fly deploy . --config services/ai-trader-shadow-worker/fly.toml --dockerfile services/ai-trader-shadow-worker/Dockerfile
app = "stocksist-ai-trader-shadow-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "services/ai-trader-shadow-worker/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[env]
  AI_TRADER_SHADOW_WORKER_POLL_INTERVAL_MS = "60000"
  AI_TRADER_SHADOW_WORKER_LOG_LEVEL = "info"
  AI_TRADER_SHADOW_WORKER_HEALTH_PORT = "8080"
  AI_TRADER_SHADOW_WORKER_PROCESS = "1"
