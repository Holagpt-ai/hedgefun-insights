# Deploy from the repository root. Do not allocate egress from a coding session.
#   fly deploy . --config services/sec-egress-gateway/fly.toml
app = "stocksist-sec-egress-gateway"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "services/sec-egress-gateway/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[env]
  PORT = "8080"
  SEC_LATEST_FILINGS_MIN_INTERVAL_SECONDS = "240"
  SEC_LATEST_FILINGS_TRANSPORT_TTL_SECONDS = "240"
